services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mtca-api:local
    container_name: mtca-api
    ports:
      - "127.0.0.1:5080:5080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://0.0.0.0:5080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    restart: unless-stopped

# sqlserver, redis, cas services will be added in subsequent setup steps.
# Default bridge network is sufficient for the basic single-container setup.

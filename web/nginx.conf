# File tham chiếu cho ops khi setup Nginx trên VPS Web.
# Xem tech_stack.md §10.4 "Mô hình deploy". Nginx chạy native systemd, không Docker.

server {
    listen 127.0.0.1:8080;
    server_name _;

    root /opt/mtca/web/dist;
    index index.html;

    # SPA fallback: mọi route client-side đều trả về index.html
    location / {
        try_files $uri /index.html;
    }

    # index.html không cache (để deploy mới có hiệu lực ngay)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Assets fingerprint (Vite thêm hash vào tên file) → cache immutable 1 năm
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
